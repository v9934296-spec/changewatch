<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f2f4ef" />
  <title>Reset password · ChangeWatch</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <a class="brand" href="/" aria-label="ChangeWatch home">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span>ChangeWatch</span>
    </a>

    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="auth-lede">We will email a secure link if an account exists for that address.</p>

      <form id="forgot-form" class="auth-form">
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" required autocomplete="email" />
        </label>
        <p id="forgot-error" class="inline-error" role="alert" hidden></p>
        <p id="forgot-success" class="inline-error auth-success" role="status" hidden></p>
        <button class="btn btn-dark auth-submit" type="submit">Send reset link</button>
      </form>

      <div class="auth-links">
        <a href="/login.html">Back to sign in</a>
      </div>
    </div>
  </div>
  <script src="/auth.js"></script>
  <script>
    const form = document.getElementById("forgot-form");
    const errorEl = document.getElementById("forgot-error");
    const successEl = document.getElementById("forgot-success");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.hidden = true;
      successEl.hidden = true;
      const body = Object.fromEntries(new FormData(form).entries());
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      try {
        const result = await authRequest("/api/auth/forgot-password", {
          method: "POST",
          body: JSON.stringify(body)
        });
        successEl.hidden = false;
        successEl.textContent = result.message;
      } catch (err) {
        errorEl.hidden = false;
        errorEl.textContent = err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
