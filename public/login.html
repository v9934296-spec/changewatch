<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f2f4ef" />
  <title>Sign in · ChangeWatch</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <a class="brand" href="/" aria-label="ChangeWatch home">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span>ChangeWatch</span>
    </a>

    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-lede">Sign in to your monitors and change history.</p>

      <form id="login-form" class="auth-form">
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" required autocomplete="email" />
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" required autocomplete="current-password" minlength="8" />
        </label>
        <p id="login-error" class="inline-error" role="alert" hidden></p>
        <button class="btn btn-dark auth-submit" type="submit">Sign in</button>
      </form>

      <div class="auth-links">
        <a href="/forgot-password.html">Forgot password?</a>
        <a href="/signup.html">Create account</a>
      </div>
    </div>
  </div>
  <script src="/auth.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");
    const params = new URLSearchParams(window.location.search);
    if (params.get("signup") === "success") {
      errorEl.hidden = false;
      errorEl.className = "inline-error auth-success";
      errorEl.textContent = "Account created. Sign in to continue.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.hidden = true;
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      const body = Object.fromEntries(new FormData(form).entries());
      try {
        await authRequest("/api/auth/login", { method: "POST", body: JSON.stringify(body) });
        redirectAfterAuth();
      } catch (err) {
        errorEl.hidden = false;
        errorEl.className = "inline-error";
        errorEl.textContent = err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
